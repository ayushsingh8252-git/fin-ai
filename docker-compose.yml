# NOTE: the root-level docker-compose.yml (../../docker-compose.yml, one
# level above apps/) is the recommended entry point for a full-stack deploy —
# it additionally wires up the episodic-memory Postgres store and the other
# two monorepo apps (ai_interview, hiring-automation) in one place. This file
# is kept for running AI-Policy-Rule-Engine standalone (backend+redis+
# frontend+postgres only); its overrides below are kept in parity with the
# root file's so episodic memory and outbound calling still work here too.
services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: policy_episodic
      POSTGRES_USER: policy
      POSTGRES_PASSWORD: policy
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U policy -d policy_episodic"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Overrides on top of .env — Linux container paths/hostnames instead of
      # the Windows-native values a local (non-Docker) dev run would use.
      PORT: "8000"
      DATABASE_URL: sqlite:////app/data/policy_engine.db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      EPISODIC_DATABASE_URL: postgresql+psycopg2://policy:policy@postgres:5432/policy_episodic
      TESSERACT_CMD: /usr/bin/tesseract
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000},http://localhost:3000,http://127.0.0.1:3000
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      # Without this, api/auth.py generates a random per-process JWT signing
      # key (see its own startup warning) — breaks token verification the
      # moment a second process needs to agree on the same key (found live
      # during this task's own verification). Override with your own
      # JWT_SECRET_KEY in production; this default is a fixed dev value, not
      # a secret worth protecting.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-4d72c13d60d2a74f2282ef2c5d8e92161b88bc14e26cb0e4efe4a8463877fbad}
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_data:/app/data
      - backend_hf_cache:/app/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # /health/ready (not the old bare /health, which is cosmetic — see
      # backend/app/api/health.py) actually verifies the primary DB and
      # Redis are reachable, so "service_healthy" means "can genuinely serve
      # requests," not just "the process started".
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      timeout: 5s
      retries: 5
      # 60s, not 30s: observed live — this container's real startup (embedding
      # model warmup, Pinecone connection pool, ECAPA-TDNN speaker encoder, a
      # Langfuse connection attempt that can itself stall) routinely takes
      # longer than 30s, flipping the container "unhealthy" before it ever
      # got a chance to serve a request.
      start_period: 60s

  # Real Celery worker for document/URL ingestion — same image as `backend`
  # (identical requirements.txt, so parsing/embedding/audio deps are already
  # present) and the same uploads/data volumes, so it can read files the
  # backend saved and write to the same DB. Only `command` differs: no HTTP
  # server, just `celery worker` consuming from the `redis` broker above.
  # --pool=solo --concurrency=1: this pipeline lazy-loads two sizeable ML
  # models as process-global singletons on first use — BAAI/bge-base-en-v1.5
  # (services/detection.py, every document/URL ingestion) and faster-whisper
  # "base" int8 (services/audio_service.py, audio ingestion only). Celery's
  # default prefork pool forks a new OS process per concurrency slot, each
  # loading its own copy of whichever model it first needs — concurrency=2
  # would mean 2x that memory for no throughput benefit on a modest VPS.
  # solo avoids forking entirely (also the only pool that works out of the
  # box on Windows, useful for running this worker outside Docker during
  # local dev) and guarantees exactly one resident copy of each model.
  # Revisit only if ingestion throughput is actually measured to be a
  # bottleneck at real usage volume — not before.
  celery-worker:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: sqlite:////app/data/policy_engine.db
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      EPISODIC_DATABASE_URL: postgresql+psycopg2://policy:policy@postgres:5432/policy_episodic
      TESSERACT_CMD: /usr/bin/tesseract
    command: celery -A app.worker:celery_app worker --loglevel=info --pool=solo --concurrency=1
    volumes:
      - backend_uploads:/app/uploads
      - backend_data:/app/data
      - backend_hf_cache:/app/.cache/huggingface
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    healthcheck:
      # `celery inspect ping` round-trips through the actual broker (Redis)
      # to the worker process and back — a real signal this worker can
      # communicate with Redis, not just that the container/Python process
      # started. Uses the `celery` console script already installed via
      # requirements.txt — no new dependency.
      test: ["CMD", "celery", "-A", "app.worker:celery_app", "inspect", "ping", "--timeout", "5"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID:-}
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  redis_data:
  postgres_data:
  backend_uploads:
  backend_data:
  backend_hf_cache:
