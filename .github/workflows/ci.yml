name: CI/CD Monorepo Pipeline

on:
  push:
    branches: [ main, master, dev ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # ==========================================
  # 1. DOCKER COMPOSE CONFIG VALIDATION
  # ==========================================
  validate-docker:
    name: Validate Docker Compose
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Validate docker-compose.yml syntax
        run: |
          docker compose config --quiet
          echo "Docker compose configuration is valid."

  # ==========================================
  # 2. PYTHON BACKENDS (Tests & Linting)
  # ==========================================
  test-python-backends:
    name: Python CI (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: "AI Policy Backend"
            dir: "apps/AI-Policy-Rule-Engine/backend"
            test_cmd: "pytest tests/ -v"
          - name: "AI Interview Backend"
            dir: "apps/ai_interview/backend"
            test_cmd: "pytest tests/ -v"
          - name: "Hiring Automation"
            dir: "apps/hiring-automation"
            test_cmd: "pytest tests/ -v"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "${{ matrix.service.dir }}/requirements.txt"

      - name: Install System Dependencies (Tesseract & Poppler)
        if: matrix.service.dir == 'apps/AI-Policy-Rule-Engine/backend'
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils libgl1

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r ${{ matrix.service.dir }}/requirements.txt
          pip install pytest pytest-cov

      - name: Run Tests
        working-directory: ${{ matrix.service.dir }}
        env:
          PYTHONPATH: .
          SECRET_KEY: "test-secret-key"
          DATABASE_URL: "sqlite:///./test.db"
          EPISODIC_DATABASE_URL: "sqlite:///./episodic_test.db"
        run: |
          ${{ matrix.service.test_cmd }}

  # ==========================================
  # 3. NODE.JS FRONTENDS (Lint & Build)
  # ==========================================
  build-frontends:
    name: Frontend CI (${{ matrix.service.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - name: "AI Policy Frontend (Next.js)"
            dir: "apps/AI-Policy-Rule-Engine/frontend"
            build_cmd: "npm run build"
            lint_cmd: "npm run lint"
          - name: "AI Interview Frontend (Vite)"
            dir: "apps/ai_interview/frontend"
            build_cmd: "npm run build"
            lint_cmd: "npm run lint"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: "${{ matrix.service.dir }}/package-lock.json"

      - name: Install Dependencies
        working-directory: ${{ matrix.service.dir }}
        run: npm ci

      - name: Lint Code
        working-directory: ${{ matrix.service.dir }}
        run: ${{ matrix.service.lint_cmd }}
        continue-on-error: true

      - name: Build Application
        working-directory: ${{ matrix.service.dir }}
        env:
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
          VITE_API_BASE: "http://localhost:8001"
        run: ${{ matrix.service.build_cmd }}
