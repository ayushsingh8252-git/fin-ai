services:
  - type: web
    name: ai-policy-backend
    # Docker, not Render's native Python buildpack — the app depends on
    # system binaries (tesseract-ocr for OCR, ffmpeg for audio via pydub)
    # that the native "env: python" runtime has no way to apt-get install.
    # backend/Dockerfile already installs both plus the spaCy model, so this
    # just reuses it instead of silently running without OCR/audio support.
    env: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_INDEX_NAME
        sync: false
      - key: PINECONE_ENVIRONMENT
        sync: false
      - key: HF_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false # SQLite has no persistent disk on the free plan — point this at a hosted Postgres URL (e.g. Neon/Supabase) so data survives redeploys.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: SARVAM_API_KEY
        sync: false
      - key: SARVAM_ORG_ID
        sync: false
      - key: SARVAM_WORKSPACE_ID
        sync: false
      - key: SARVAM_APP_ID
        sync: false
      - key: SARVAM_APP_VERSION
        sync: false
      - key: SARVAM_CONNECTION_ID
        sync: false
      - key: SARVAM_AGENT_PHONE_NUMBER
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false # Set to this service's own Render URL (e.g. https://ai-policy-backend.onrender.com) once deployed — Sarvam calls back into this with the outbound-call result.
      - key: CORS_ORIGINS
        value: "https://ai-policy-rule-engine.vercel.app" # Set to your production Vercel domain (custom domain, or the project's default *.vercel.app URL). Every *.vercel.app preview deployment is additionally allowed automatically via regex in app/main.py.
